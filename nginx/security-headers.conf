# Security headers sent with every response of the site.
#
# They live in their own file because nginx's add_header does not merge
# across levels: a location that declares any add_header of its own (the
# caching tiers set Cache-Control) inherits NONE of the server-level ones.
# nginx.conf therefore includes this file once at server level, for the
# locations that set no header, and again inside every location that does.
# Add a security header here, never inline in nginx.conf, or part of the site
# will go without it.
#
# `always` keeps them on error responses (404…) too; add_header otherwise
# applies to 2xx and 3xx responses only.
#
# Strict-Transport-Security is not set here: the ingress in front of this
# container adds it.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
