worker_processes auto;

# nginx-unprivileged runs as uid 101 which cannot write to /run.
# Override the compiled-in default; matches the base image's own override.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers, and let the browser resolve them against
    # the origin it actually used.
    #
    # nginx expands a relative `return 301 /partenaires$1` into an absolute URL
    # built from $scheme://$host:$server_port. Behind the ingress it sees
    # neither the real scheme nor the real port, so every redirect below went
    # out as http://<host>:8080/... — downgrading https to http AND advertising
    # the container's internal port. Live on production:
    #   https://cloudnativedays.fr/sponsors -> http://cloudnativedays.fr:8080/partenaires
    #
    # This also covers nginx's implicit directory redirects (/foo -> /foo/),
    # which had the same defect. A relative Location is explicitly permitted by
    # RFC 7231 §7.1.2 and is the standard fix for a proxied nginx; the
    # alternative — trusting X-Forwarded-Proto and setting port_in_redirect off
    # — needs the ingress to be sending those headers and is easier to get
    # subtly wrong.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # Caching policy
    #
    # Every file this server sends carries an explicit Cache-Control. Without
    # one, browsers fall back to *heuristic* freshness (RFC 9111 §4.2.2):
    # Chrome and Firefox reuse the response for 10% of (Date - Last-Modified)
    # without asking the server at all. Last-Modified is the image build time
    # (the whole dist/ is generated then), so the longer the site went without
    # a deploy, the longer visitors kept the old page AFTER the next one. Seen
    # on 2026-10-06: /equipe and /billetterie stayed stale after PR #64
    # shipped, until a refresh — a copy of a page built two days before a
    # deploy counts as fresh for ~5h, so no request reaches the server.
    #
    # Three tiers, from the most to the least cacheable:
    #
    #   1. /_astro/*      Content-hashed by Astro: a changed file gets a new
    #                     name, so a cached copy can never be stale.
    #                     -> one year, immutable.
    #   2. other assets   Files from public/ (team, speaker, sponsor photos,
    #                     favicon…). Their names are stable, so replacing one
    #                     in place must still reach visitors.
    #                     -> one day, then revalidated. NOT immutable: that
    #                     would skip revalidation even on a plain reload, and
    #                     a replaced photo could stay stale for a year.
    #   3. everything     HTML, plus robots.txt, the sitemap, programme.ics,
    #      else           the PDF… -> no-cache.
    #
    # "no-cache" is not "do not cache" (that is no-store): the browser keeps
    # its copy and revalidates it with If-None-Match before each use. nginx
    # emits an ETag for every static file (`etag on` is the default), so an
    # unchanged page costs one round trip and a body-less 304, and a changed
    # page is picked up on the first visit after a deploy. Pages are a few
    # dozen KB and all their weight sits in tier 1, which is never re-fetched.
    #
    # Each block below sets Cache-Control with add_header, which makes it lose
    # every server-level add_header — hence the include of
    # security-headers.conf in each one. Drop it and that tier silently ships
    # without X-Frame-Options & co. (this already happened to the assets
    # tier). Use a single add_header for Cache-Control rather than `expires`,
    # which emits a second, separate Cache-Control header.

    # Tier 1. `^~` is required: without it nginx would still evaluate the
    # regex location below and let it win, applying tier 2 to hashed files.
    location ^~ /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
    }

    # Tier 2.
    # webp/avif must be listed here so the legacy /sponsors and /speakers
    # 301 redirects below don't swallow asset requests like
    # /sponsors/circleci.webp and bounce them into a 404 under /partenaires.
    # For the same reason this block must stay ABOVE those redirects: nginx
    # tries regex locations in the order they appear and keeps the first match.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
      add_header Cache-Control "public, max-age=86400";
      include /etc/nginx/security-headers.conf;
    }

    # 301 redirects: legacy English-named FR slugs → French slugs.
    # Apr-2026 site refresh moved /tickets, /team, /sponsors, /speakers under
    # French URLs. EN paths (/en/*) stay on the English slugs.
    location ~ ^/tickets/?$           { return 301 /billetterie/; }
    location ~ ^/team/?$              { return 301 /equipe/; }
    location ~ ^/sponsors(/.*)?$      { return 301 /partenaires$1; }
    location ~ ^/speakers(/.*)?$      { return 301 /intervenants$1; }

    # SPA-style fallback for clean URLs
    # Tier 3: /equipe and /equipe/ are served from equipe/index.html inside
    # this block (try_files does not redirect internally for anything but its
    # last argument), so this Cache-Control is the one HTML pages get.
    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }

    # Custom 404 page: src/pages/404.astro, one bilingual page for every
    # unknown URL, /en/… included. Like any HTML it is no-cache; `always`
    # because add_header skips 4xx responses without it.
    error_page 404 /404.html;
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
    }

    # Security headers, for the locations that set no header of their own:
    # the 301 redirects above and nginx's built-in error pages. The caching
    # tiers and the 404 page include the same file themselves — see "Caching
    # policy".
    include /etc/nginx/security-headers.conf;
  }
}
