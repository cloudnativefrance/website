worker_processes auto;

# nginx-unprivileged runs as uid 101 which cannot write to /run.
# Override the compiled-in default; matches the base image's own override.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers, and let the browser resolve them against
    # the origin it actually used.
    #
    # nginx expands a relative `return 301 /partenaires$1` into an absolute URL
    # built from $scheme://$host:$server_port. Behind the ingress it sees
    # neither the real scheme nor the real port, so every redirect below went
    # out as http://<host>:8080/... — downgrading https to http AND advertising
    # the container's internal port. Live on production:
    #   https://cloudnativedays.fr/sponsors -> http://cloudnativedays.fr:8080/partenaires
    #
    # This also covers nginx's implicit directory redirects (/foo -> /foo/),
    # which had the same defect. A relative Location is explicitly permitted by
    # RFC 7231 §7.1.2 and is the standard fix for a proxied nginx; the
    # alternative — trusting X-Forwarded-Proto and setting port_in_redirect off
    # — needs the ingress to be sending those headers and is easier to get
    # subtly wrong.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # Cache static assets aggressively.
    # webp/avif must be listed here so the legacy /sponsors and /speakers
    # 301 redirects below don't swallow asset requests like
    # /sponsors/circleci.webp and bounce them into a 404 under /partenaires.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # 301 redirects: legacy English-named FR slugs → French slugs.
    # Apr-2026 site refresh moved /tickets, /team, /sponsors, /speakers under
    # French URLs. EN paths (/en/*) stay on the English slugs.
    location ~ ^/tickets/?$           { return 301 /billetterie/; }
    location ~ ^/team/?$              { return 301 /equipe/; }
    location ~ ^/sponsors(/.*)?$      { return 301 /partenaires$1; }
    location ~ ^/speakers(/.*)?$      { return 301 /intervenants$1; }

    # SPA-style fallback for clean URLs
    location / {
      try_files $uri $uri/index.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
