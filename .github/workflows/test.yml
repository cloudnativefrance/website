# Runs the Vitest suite on every change.
#
# Until this existed nothing executed `pnpm test`, which is how the suite stayed
# red across several releases with 17 failing assertions nobody saw.
name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # The specs under tests/build/ assert against built HTML, so the build is
      # part of the test setup rather than a separate concern. Skipping it makes
      # discover-page.test.ts silently skip and the two speaker specs throw.
      #
      # This step fetches the Pretalx released-schedule export (sessions and
      # speakers) and the published Google Sheets (sponsors, team). If either
      # fails, the loaders fall back to the copies committed under src/content/,
      # which carry the same speaker anchors the specs rely on — so the suite
      # passes on either path, with or without network.
      #
      # The token is what makes the authenticated half real. Without it the
      # build ships no speaker companies, roles or level chips, and every test
      # gated on `hasToken` SKIPS rather than fails — including the keynote
      # MERGE GATE, so the run went green having tested none of it.
      #
      # PRETALX_TOKEN_REQUIRED is deliberately NOT set: fork pull requests
      # receive no secrets, and making a missing token fatal would fail every
      # outside contributor's build. They still get the skip behaviour; runs on
      # this repo get the real thing. Check the skip count, per docs/testing.md.
      - run: pnpm build
        env:
          PRETALX_API_TOKEN: ${{ secrets.PRETALX_API_TOKEN }}

      - run: pnpm test
        env:
          PRETALX_API_TOKEN: ${{ secrets.PRETALX_API_TOKEN }}

      # Type-checks .astro, .ts and .tsx. Kept after the tests so a type
      # regression is reported alongside a green suite rather than masking it.
      - run: pnpm astro check

# Deliberately no `paths:` filter. Scoping this to source directories would let
# a change to the Dockerfile, a workflow, or a config file land untested — and a
# `paths:` filter is also why a branch-creation push silently builds nothing
# (see build-image.yml). Correctness beats a saved minute here.
